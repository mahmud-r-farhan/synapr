name: Smoke (CLI & Dashboard)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    # Weekly guard against dependency drift (Mondays, 05:00 UTC).
    - cron: "0 5 * * 1"

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Synapr from source
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Configure git identity
        run: |
          git config --global user.name "Synapr CI"
          git config --global user.email "ci@synapr.local"
          git config --global init.defaultBranch main

      - name: Run end-to-end smoke test
        run: python scripts/smoke_test.py

  env-matrix:
    name: Environment-variable configuration
    runs-on: ubuntu-latest
    env:
      SYNAPR_PROVIDER: ollama
      SYNAPR_PLANNER_MODEL: ci-planner:latest
      SYNAPR_UI_PORT: "9123"
      SYNAPR_AUTO_MERGE: "false"
      SYNAPR_CRITIC_MODELS: "critic-a,critic-b"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Synapr
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify every layer resolves as documented
        run: |
          python - <<'PY'
          import json, subprocess, sys

          out = subprocess.run(
              [sys.executable, "-m", "synapr", "config", "show", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout
          cfg = json.loads(out)

          expected = {
              ("gateway", "default_provider"): "ollama",
              ("gateway", "planner_model"): "ci-planner:latest",
              ("ui", "port"): 9123,
              ("pipeline", "auto_merge"): False,
              ("gateway", "critic_models"): ["critic-a", "critic-b"],
          }
          for (section, key), value in expected.items():
              actual = cfg[section][key]
              assert actual == value, f"{section}.{key} = {actual!r}, expected {value!r}"
          print("Environment variables map onto the configuration correctly.")
          PY

      - name: Verify env values are never written into the config file
        run: |
          python -m synapr config set project_name "CI Project"
          python - <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path("synapr.config.json").read_text(encoding="utf-8"))
          assert payload["project_name"] == "CI Project"
          assert payload["gateway"]["default_provider"] == "mock", payload["gateway"]
          print("Environment-sourced values stay out of the persisted file.")
          PY
