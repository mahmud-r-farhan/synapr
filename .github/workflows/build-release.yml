name: Build & Release Multi-Platform

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: "windows-x64"
          - os: ubuntu-latest
            platform: "linux-x86_64"
          - os: macos-latest
            platform: "macos-arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies & build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev] pyinstaller

      - name: Ensure Inno Setup on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and package distribution
        run: python scripts/build_dist.py

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synapr-dist-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist-artifacts
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          ls -la

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "val=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "val=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "val=v0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Distribute in GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.zip
            dist-artifacts/*.deb
            dist-artifacts/*.tar.gz
            dist-artifacts/SHA256SUMS.txt
          tag_name: ${{ steps.tag.outputs.val }}
          name: Synapr ${{ steps.tag.outputs.val }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## ⚡ Synapr — Autonomous Local Multi-IDE AI Development Orchestrator

            ### 🔒 100% Local Machine & Zero Data Leak Guarantee
            - **Zero Telemetry**: No code, prompts, or metrics are collected by Synapr.
            - **Air-Gapped Swarm Engine**: Decompositions, multi-model consensus, Git worktrees, tests, and self-healing run entirely on your local machine.
            - **Zero External Assets**: Visual dashboard has no external CDNs, fonts, or tracking scripts.

            ### 📦 Distribution Packages
            - **Windows Installer (`Synapr-Setup-x64-v*.exe`)**:
              - "Next Next Next" setup wizard with application icon
              - Displays MIT License agreement
              - Shortcut toggles (Desktop shortcut ON/OFF, Start Menu, PATH integration)
              - Displays Zero Data Leak & Local machine execution guarantee
              - One-click launch into the local Web UI
            - **Windows Portable (`synapr-windows-x64-v*.zip`)**: Standalone zip distribution.
            - **Linux Package (`synapr_*_amd64.deb`)**: Native Debian/Ubuntu installer package with desktop menu launcher and icon.
            - **Linux Portable (`synapr-linux-*-v*.tar.gz`)**: Standalone Linux distribution.
            - **macOS Portable (`synapr-macos-*-v*.tar.gz`)**: Standalone macOS distribution.

            ### ⚖️ License
            Released under the **MIT License**.
