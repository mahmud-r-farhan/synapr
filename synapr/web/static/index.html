<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapr ⚡ Local Multi-IDE AI Swarm</title>
  <!-- 100% local assets: no external fonts, CDNs or trackers are ever requested. -->
  <link rel="icon" type="image/x-icon" href="/assets/image.ico">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/styles-views.css">
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <img src="/assets/image.ico" alt="Synapr Logo" class="brand-logo" width="28" height="28">
      <span class="brand-mark">⚡ Synapr Swarm OS</span>
      <span class="brand-version" id="brand-version">v0.1.0</span>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-view="swarm">🚀 Swarm</button>
      <button class="tab" role="tab" data-view="research">🌐 Research &amp; Browser</button>
      <button class="tab" role="tab" data-view="github">🐙 GitHub Issues</button>
      <button class="tab" role="tab" data-view="email">✉️ Email Hub</button>
      <button class="tab" role="tab" data-view="config">⚙️ Configuration</button>
      <button class="tab" role="tab" data-view="env">🔐 Environment</button>
    </nav>

    <div class="badge-status" id="status-badge" title="Active LLM provider and base branch">
      <span class="badge-pulse"></span>
      <span id="system-status-text">Connecting…</span>
    </div>
  </header>

  <main class="container">
    <!-- SYNAPR:swarm -->
    <!-- SYNAPR:research -->
    <!-- SYNAPR:github -->
    <!-- SYNAPR:email -->
    <!-- SYNAPR:config -->
    <!-- SYNAPR:environment -->
  </main>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <script src="/assets/app.js"></script>
  <script src="/assets/swarm.js"></script>
  <script src="/assets/config-fields.js"></script>
  <script src="/assets/config-actions.js"></script>
  <script src="/assets/environment.js"></script>
  <script src="/assets/research.js"></script>
  <script src="/assets/github.js"></script>
  <script src="/assets/email.js"></script>
  <script src="/assets/bootstrap.js"></script>
</body>
</html>
